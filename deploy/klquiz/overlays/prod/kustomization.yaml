# Production (exam.klfacultyhiring.com). Only a release tag changes the image tag: the k8s-release workflow
# re-tags the image staging already ran (no rebuild) and commits it here; Flux applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: klquiz-prod
resources:
  - namespace.yaml
  - ../../base
  - ../../live
  - backup.yaml
images:
  - name: ghcr.io/satish5813/klquiz
    newTag: "v1.5.1"
configMapGenerator:
  - name: klquiz-backup-scripts
    files:
      - backup.sh
      - backup-encrypt.js
      - restore-test.sh
patches:
  - target: {kind: Ingress, name: klquiz}
    patch: |
      - op: add
        path: /spec/rules/0/http/paths/0
        value: {path: /live, pathType: Prefix, backend: {service: {name: live, port: {name: http}}}}
  - target: {kind: ClusterRole, name: klquiz-live-metrics}
    patch: |
      - {op: replace, path: /metadata/name, value: klquiz-live-metrics-prod}
  - target: {kind: ClusterRoleBinding, name: klquiz-live-metrics}
    patch: |
      - {op: replace, path: /metadata/name, value: klquiz-live-metrics-prod}
      - {op: replace, path: /roleRef/name, value: klquiz-live-metrics-prod}
      - {op: replace, path: /subjects/0/namespace, value: klquiz-prod}
  - target: {kind: Ingress, name: klquiz}
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: exam.klfacultyhiring.com
