# Staging: every green build lands here automatically (the CI job rewrites the newTag line).
# Private: the hostname is not routed through the Cloudflare tunnel. Test with:
#   kubectl -n klquiz-staging port-forward deploy/app 8080:8080   then open http://localhost:8080
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: klquiz-staging
resources:
  - namespace.yaml
  - ../../base
  - ../../live
images:
  - name: ghcr.io/satish5813/klquiz
    newTag: "0249980dc2eb"
patches:
  - target: {kind: Ingress, name: klquiz}
    patch: |
      - op: add
        path: /spec/rules/0/http/paths/0
        value: {path: /live, pathType: Prefix, backend: {service: {name: live, port: {name: http}}}}
  - target: {kind: ClusterRole, name: klquiz-live-metrics}
    patch: |
      - {op: replace, path: /metadata/name, value: klquiz-live-metrics-staging}
  - target: {kind: ClusterRoleBinding, name: klquiz-live-metrics}
    patch: |
      - {op: replace, path: /metadata/name, value: klquiz-live-metrics-staging}
      - {op: replace, path: /roleRef/name, value: klquiz-live-metrics-staging}
      - {op: replace, path: /subjects/0/namespace, value: klquiz-staging}
  - target: {kind: Ingress, name: klquiz}
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-exam.klfacultyhiring.com
