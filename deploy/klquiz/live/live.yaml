# Same image as the exam portal, started with live/server.js. Holds only the latest frame per candidate in memory
# (no volume); a restart only drops live video for a few seconds - candidates' exams are unaffected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: live
---
# Read-only CPU/memory metrics of the servers and pods for the monitor's "Servers" panel.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: klquiz-live-metrics
rules:
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: klquiz-live-metrics
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: klquiz-live-metrics}
subjects:
  - {kind: ServiceAccount, name: live, namespace: NAMESPACE_SET_BY_OVERLAY}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: klquiz-live}}
  template:
    metadata:
      labels: {app: klquiz-live}
    spec:
      serviceAccountName: live
      nodeSelector: {klu/role: apps}
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: live
          image: ghcr.io/satish5813/klquiz:latest
          command: ["/sbin/tini", "--", "node", "live/server.js"]
          env:
            - {name: LIVE_PORT, value: "8090"}
            - {name: NODE_ENV, value: production}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: klquiz-env, key: JWT_SECRET}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports: [{name: http, containerPort: 8090}]
          readinessProbe:
            httpGet: {path: /live/healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /live/healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: live
spec:
  selector: {app: klquiz-live}
  ports: [{name: http, port: 80, targetPort: http}]
---
# Traefik -> live monitor; DNS; and the Kubernetes API (metrics) only: its service IP and the API server endpoint
# (kubectl get endpoints kubernetes = 172.16.0.1:6443 on this cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: live
spec:
  podSelector: {matchLabels: {app: klquiz-live}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{port: 8090}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.43.0.1/32}}, {ipBlock: {cidr: 172.16.0.1/32}}]
      ports: [{port: 443}, {port: 6443}]
