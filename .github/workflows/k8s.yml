# K3s delivery for the KL Entrance Exam portal. On every push to main:
#   1. unit tests and syntax checks
#   2. image built, smoke-tested (starts with a fresh database, health, headers, CSRF guard), scanned (fixable CRITICAL fails), pushed to GHCR
#   3. deploy/klquiz/overlays/staging points at it; Flux on the cluster rolls staging out
name: K8s - test, build, deploy staging
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/klquiz/**', 'deploy/clusters/**', 'backups/**', 'docs/**', '**.md']

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/klquiz

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Syntax
        run: for f in server/*.js server/routes/*.js scripts/*.js public/js/*.js public/admin/*.js; do node --check "$f"; done

  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Smoke test
        run: |
          img=$IMAGE:${{ github.sha }}
          # Same hardening as the cluster: read-only root, writable /data and /tmp only, non-root, no capabilities.
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp --tmpfs /data:rw,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e JWT_SECRET=smoke-jwt-secret-smoke-jwt-secret-smoke-jwt-secret \
            -e APP_SECRET=smoke-app-secret-smoke-app-secret-smoke-app-secret \
            -e ADMIN_PASSWORD=smoke-admin-password -e SECURE_COOKIES=true -e TRUST_PROXY=1 \
            -e CLIENT_IP_HEADER=cf-connecting-ip "$img"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/api/health | grep -q '"ok":true' || { docker logs smoke; exit 1; }
          curl -sf http://127.0.0.1:8080/ | grep -q "KL Admissions" && echo " student page served"
          curl -sI http://127.0.0.1:8080/ | grep -qi 'content-security-policy' && echo "security headers present"
          curl -sf http://127.0.0.1:8080/vendor/katex/katex.min.js >/dev/null && echo "formula renderer served"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:8080/api/admin/login)
          [ "$code" = 403 ] || { echo "write without the request header should be 403, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-KL-Req: 1' -H 'content-type: application/json' -d '{"username":"admin","password":"smoke-admin-password"}' http://127.0.0.1:8080/api/admin/login)
          [ "$code" = 200 ] || { echo "admin login should be 200, got $code"; docker logs smoke; exit 1; }
          docker logs smoke | grep -q "Seeded KL Admissions" && echo "fresh database seeded with the exam patterns"
      - name: Vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:${GITHUB_SHA::12}"

  deploy-staging:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point staging at the new image (Flux applies it on the cluster)
        # start from the newest branch tip each try, and never move staging back to an older commit's image
        run: |
          f=deploy/klquiz/overlays/staging/kustomization.yaml
          git config user.name "klquiz-ci"
          git config user.email "klquiz-ci@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then echo "branch moved away from $GITHUB_SHA"; exit 0; fi
            cur=$(sed -n 's/^    newTag: "\(.*\)"/\1/p' "$f" | head -1)
            if [ -n "$cur" ] && [ "$cur" != latest ] && git cat-file -e "$cur^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$GITHUB_SHA" "$cur" && [ "${cur::12}" != "${GITHUB_SHA::12}" ]; then
              echo "staging already runs a newer build ($cur)"; exit 0
            fi
            sed -i "s|^    newTag: .*|    newTag: \"${GITHUB_SHA::12}\"|" "$f"
            git add "$f"
            git commit -q -m "deploy(klquiz-staging): ${GITHUB_SHA::12} [skip ci]" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((try * 5))
          done
          echo "could not push the staging bump"; exit 1
